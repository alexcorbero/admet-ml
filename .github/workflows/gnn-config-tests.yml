name: GNN configuration tests

on:
  push:
    branches: [gnn-agentic]
  pull_request:
    branches: [gnn-agentic]

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RDKit for atom-feature tests
        run: python -m pip install numpy==1.26.4 rdkit==2023.9.6
      - name: Run GNN configuration tests
        run: python -m unittest discover -s tests/gnn -p "test_*.py" -v
      - name: Run conformer preparation tests
        run: python -m unittest discover -s tests/features -p "test_*.py" -v

  model-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model test dependencies
        run: |
          python -m pip install numpy==1.26.4 rdkit==2023.9.6
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install torch-geometric==2.6.1
      - name: Run model tests
        run: python -m unittest discover -s tests/models -p "test_*.py" -v
