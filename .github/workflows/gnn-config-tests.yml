name: GNN configuration tests

on:
  push:
    branches: [gnn-agentic]
  pull_request:
    branches: [gnn-agentic]

jobs:
  config-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run GNN configuration tests
        run: python -m unittest discover -s tests/gnn -p "test_*.py" -v
